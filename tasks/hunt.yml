- title: "Domains"
  category: Domain
  type: cypher
  format: HTML
  output: Domains.html
  cypher: >
    MATCH (n:Domain) return n.name as Domain, n.functionallevel as FunctionalLevel, n.highvalue as HighValue, n.domain as DNS

- title: "Domain Trusts"
  category: Domain
  type: cypher
  format: HTML
  output: DomainTrusts.html
  cypher: >
    MATCH p=(n:Domain)-[r:TrustedBy]->(m:Domain) RETURN n.name as Domain1, r.trusttype as TrustType, r.isacl as IsACL, r.sidfiltering as SidFiltering, r.transitive as transitive,  m.name as Domain2 order by n.name, m.name

- title: "Domain Controllers"
  category: Domain
  type: cypher
  format: HTML
  output: DomainControllers.html
  cypher: >
    MATCH (c:Computer)-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-516' RETURN c.name as Hostname, c.operatingsystem as OS, c.description as Description, c.whencreated as Created,c.haslaps as LAPS, c.enabled as Enabled

- title: "Enterprise Admins"
  category: Uncategorized
  type: cypher
  format: HTML
  output: EnterpriseAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-519' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "Schema Admins"
  category: Uncategorized
  type: cypher
  format: HTML
  output: SchemaAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-518' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "Domain Admins"
  category: Uncategorized
  type: cypher
  format: HTML
  output: DomainAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-512' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "Cert Publishers"
  category: Uncategorized
  type: cypher
  format: HTML
  output: CertPublishers.html
  cypher: >
     MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-517' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "DA Sessions"
  category: Access
  type: cypher
  format: HTML
  output: DA_Sessions.html
  cypher: >
    MATCH (n:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' MATCH p = (c:Computer)-[:HasSession]->(n) return n.name as Username, c.name as Computer

- title: "EA Sessions"
  category: Access
  type: cypher
  format: HTML
  output: EA_Sessions.html
  cypher: >
    MATCH (n:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-519' MATCH p = (c:Computer)-[:HasSession]->(n) return n.name as Username, c.name as Computer

- title: "Kerberoastable Users"
  category: Kerberos
  type: cypher
  format: HTML
  output: Kerberoastable_Users.html
  cypher: >
    MATCH (n:User) WHERE n.hasspn=true RETURN n.name as Username, n.displayname as DisplayName,n.description as Description, n.title as Title, n.pwdneverexpires as PasswordNeverExpires, n.passwordnotreqd as PasswordNotRequired, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPNs

- title: "Unconstrained Delegation Computers with SPN Non-DC"
  category: Kerberos
  type: cypher
  format: HTML
  output: Computers_UnconstrainedDelegationNonDC.html
  cypher: >
    MATCH (c1:Computer)-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (c2:Computer {unconstraineddelegation:true}) WHERE NOT c2.name IN domainControllers RETURN c2.name as Computer, c2.description as Description, c2.operatingsystem as OS, c2.serviceprincipalnames as SPN ORDER BY c2.name ASC

- title: "PasswordResetter Groups Count"
  category: Privilege
  type: cypher
  format: HTML
  output: Groups_CanResetPasswordsCount.html
  cypher: >
    MATCH p=(m:Group)-[r:ForceChangePassword]->(n:User) RETURN m.name as Group, count(*) as Users ORDER BY Users DESC

- title: "GPO Creator Owners"
  category: Uncategorized
  type: cypher
  format: HTML
  output: GPOCreatorOwners.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-520' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "Computers with MSSQL SPN"
  category: Kerberos
  type: cypher
  format: HTML
  output: Computers_MSSQL.html
  cypher: >
    MATCH (c:Computer) WHERE ANY (x IN c.serviceprincipalnames WHERE toUpper(x) CONTAINS 'MSSQL') RETURN c.name as Computer, c.enabled as Enabled, c.serviceprincipalnames as SPN ORDER BY c.name ASC

- title: "LAPS Not Enabled"
  category: Systems
  type: cypher
  format: HTML
  output: LAPSNotEnabled.html
  cypher: >
    MATCH (c:Computer) WHERE c.haslaps=false RETURN c.name as Computer, c.enabled as Enabled, c.operatingsystem as OS, c.description as Descirption ORDER BY Computer

- title: "Operating Systems Unsupported"
  category: Systems
  type: cypher
  format: HTML
  output: OperatingSystemUnsupported.html
  cypher: >
    MATCH (c:Computer) WHERE c.operatingsystem =~ '.*(2000|2003|2008|2012|xp|vista|7|me).*' RETURN c.name as Computer, c.operatingsystem as UnsupportedOS, c.enabled as Enabled

- title: "Users With 5 Year Old Passwords"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Users_5YrOldPasswords.html
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User) WHERE date_now - toInteger(n.pwdlastset) > 157680000 AND n.pwdlastset<>-1.0  AND n.pwdlastset<>0.0 RETURN n.name as Username, n.displayname as DisplayName, n.description as Description, n.enabled as Enabled, n.admincount as AdminCount, n.pwdneverexpires as PassNeverExpire, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon ORDER BY n.pwdlastset

- title: "Users With 10 Year Old Passwords"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Users_10YrOldPasswords.html
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User) WHERE date_now - toInteger(n.pwdlastset) > 315360000 AND n.pwdlastset<>-1.0  AND n.pwdlastset<>0.0 RETURN n.name as Username, n.displayname as DisplayName, n.description as Description, n.enabled as Enabled, n.admincount as AdminCount, n.pwdneverexpires as PassNeverExpire, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon ORDER BY n.pwdlastset

- title: "Users With Userpassword Attribute"
  category: Hygiene
  type: cypher
  format: HTML
  output: Users_userpassword.html
  cypher: >
    MATCH (u:User) WHERE NOT u.userpassword IS null RETURN u.name as User, u.userpassword as Password, u.enabled as Enabled

- title: "Users Password Never Expires Exception"
  category: Hygiene
  type: cypher
  format: HTML
  output: Users_NeverExpirePasswords.html
  cypher: >
    MATCH (n:User) WHERE n.pwdneverexpires RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Non-Admins with Add To Group Delegation (Limited to 10000)"
  category: Uncategorized
  type: cypher
  format: HTML
  output: User-AddToGroupDelegation.html
  cypher: >
    MATCH (n:User {admincount:False}) MATCH p=allShortestPaths((n)-[r:AddMember*1..]->(m:Group)) RETURN n.name as User, m.name as Group Limit 10000

- title: "Non-Admins with Add To Group Delegation Count (Limited to 1000)"
  category: Uncategorized
  type: cypher
  format: HTML
  output: User-AddToGroupDelegation.html
  cypher: >
    MATCH (n:User {admincount:False}) MATCH p=allShortestPaths((n)-[r:AddMember*1..]->(m:Group)) RETURN n.name as User, count(m.name) as Groups Limit 1000

- title: "Owned Groups"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Groups.html
  cypher: >
    Match (n:Group) where n.owned=TRUE return n.name as Name, n.highvalue as HighValue, n.description as Description

- title: "Owned Users"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Users.html
  cypher: >
    MATCH (n:User) WHERE n.owned=TRUE RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Owned Computers"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Computers.html
  cypher: >
    MATCH (n:Computer) where n.owned=TRUE RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon,n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

- title: "Owned Users Groups"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Owned-Users-Groups.html
  cypher: >
    MATCH (m:User) WHERE m.owned=TRUE WITH m MATCH p=(m)-[:MemberOf*1..]->(n:Group) RETURN m.name, n.name ORDER BY m.name

- title: "Owned Computers Groups"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Owned-Computers-Groups.html
  cypher: >
    MATCH (m:Computer) WHERE m.owned=TRUE WITH m MATCH p=(m)-[:MemberOf*1..]->(n:Group) RETURN m.name, n.name ORDER BY m.name

- title: "Owned Objects"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Objects.html
  cypher: >
    MATCH (n {owned:true}) return n.name as Name, n.highvalue as HighValue, n.enabled as Enabled, n.trustedtoauth as TrustedToAuth, n.unconstraineddelegation as UncDelegation, n.serviceprincipalnames as SPN

- title: "Owned Objects Admin To"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Objects-AdminTo-Direct.html
  cypher: >
    MATCH (n {owned:true})-[r:AdminTo]->(c:computer) return n.name as Name, n.highvalue as HighValue, n.enabled as Enabled, c.name as Computer, c.highvalue as ComputerHighValue, c.enabled as ComputerEnabled, c.serviceprincipalname as ComputerSPN

- title: "Owned Objects Member Of"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Owned-Objects-MemberOf-Direct.html
  cypher: >
    MATCH (n {owned:true})-[r:MemberOf]->(g:Group) return n.name as Name, n.highvalue as HighValue, n.enabled as Enabled, g.name as GroupName, g.description as GroupDescription

- title: "Hunt - Users with Pass or PW in Description"
  category: Hunt
  type: cypher
  format: HTML
  output: HuntUsersWithPassInDescription.html
  cypher: >
    MATCH (n:User) WHERE n.description  =~ '(?i).*(pass|pw).*' RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Hunt - Users with Change in Description"
  category: Hunt
  type: cypher
  format: HTML
  output: HuntUsersWithPassInDescription.html
  cypher: >
    MATCH (n:User) WHERE n.description  =~ '(?i).*(change).*' RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Hunt - Computers with Pass or PW in Description"
  category: Hunt
  type: cypher
  format: HTML
  output: HuntComputersWithPassInDescription.html
  cypher: >
    MATCH (n:Computer) WHERE n.description =~ '(?i).*(pass|pw).*' RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon,n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

- title: "Report Index"
  category: Uncategorized
  type: directive
  format: HTML
  output: index.html
  cypher: >
    REPORT-INDEX

