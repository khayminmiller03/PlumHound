- title: "Hunt - Computers with Pass or PW in Description"
  category: Hunt
  type: cypher
  format: HTML
  output: HuntComputersWithPassInDescription.html
  cypher: >
    MATCH (n:Computer) WHERE n.description =~ '(?i).*(pass|pw).*' RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogontimestamp,0))})) as LastLogonTimeStamp, n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

