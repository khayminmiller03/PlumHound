- title: "Domains"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: Domains
  cypher: >
    MATCH (n:Domain) return n.name as Domain, n.functionallevel as FunctionalLevel, n.highvalue as HighValue, n.domain as DNS, n.distinguishedname as DN, n.domainsid as SID

- title: "Domain Trusts"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: DomainTrusts
  cypher: >
    MATCH p=(n:Domain)-[r:TrustedBy]->(m:Domain) RETURN n.name as Domain1, r.trusttype as TrustType, r.isacl as IsACL, r.sidfiltering as SidFiltering, r.transitive as transitive,  m.name as Domain2 order by n.name, m.name

- title: "Domain Controllers"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: DomainControllers
  cypher: >
    MATCH (c:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-516' RETURN c.name as Hostname, c.operatingsystem as OS, c.description as Description,toString(datetime({epochSeconds: ToInteger(coalesce(c.whencreated,0))})) as Created,c.haslaps as LAPS, c.enabled as Enabled, c.distinguishedname as DN

- title: "Domain Controllers - Read Only"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: DomainControllers_ReadOnly
  cypher: >
    MATCH (c:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-521' RETURN c.name as Hostname, c.operatingsystem as OS, c.description as Description,toString(datetime({epochSeconds: ToInteger(coalesce(c.whencreated,0))})) as Created,c.haslaps as LAPS, c.enabled as Enabled, c.distinguishedname as DN

- title: "Enterprise Admins (Direct)"
  category: Privilege
  type: cypher
  format: HTML
  output: EnterpriseAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-519' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, head(labels(m)) as type, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation,  toString(datetime({epochSeconds: ToInteger(coalesce(m.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(m.lastlogontimestamp,0))})) as LastLogonTimeStamp ORDER BY Name

- title: "Schema Admins (Direct)"
  category: Privilege
  type: cypher
  format: HTML
  output: SchemaAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-518' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, head(labels(m)) as type, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation,  toString(datetime({epochSeconds: ToInteger(coalesce(m.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(m.lastlogontimestamp,0))})) as LastLogonTimeStamp ORDER BY Name

- title: "Domain Admins (Direct)"
  category: Privilege
  type: cypher
  format: HTML
  output: DomainAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-512' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, head(labels(m)) as type, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation,  toString(datetime({epochSeconds: ToInteger(coalesce(m.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(m.lastlogontimestamp,0))})) as LastLogonTimeStamp ORDER BY Name

- title: "Admin Groups"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: AdminGroups
  cypher: >
    Match (n:Group) WHERE n.name CONTAINS 'ADMIN' return n.name as Name, n.highvalue as HighValue, n.description as Description, n.admincount as AdminCount

- title: "Admin Groups Direct Population"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: AdminGroupsPopulatedCount
  cypher: >
    Match (u)-[:MemberOf]->(g:Group) WHERE toUPPER (g.name) CONTAINS 'ADMIN' return g.name as Group, g.description as Description,  Count(DISTINCT(u.name)) as Members ORDER BY Members DESC

- title: "Domain User Accounts"
  category: Inventory
  type: cypher
  format: HTMLCSV
  output: DomainUsers
  cypher: >
    MATCH (n:User) RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogontimestamp,0))})) as LastLogonTimeStamp

- title: "Domain Computer Accounts"
  category: Inventory
  type: cypher
  format: HTMLCSV
  output: DomainComputers
  cypher: >
    MATCH (n:Computer) RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogontimestamp,0))})) as LastLogonTimeStamp,n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

- title: "Domain Groups"
  category: Inventory
  type: cypher
  format: HTMLCSV
  output: DomainGroups
  cypher: >
    Match (o)-[r:Owns]->(n:Group) return n.name as Name, n.highvalue as HighValue, n.description as Description, o.name as Owner, head(Labels(o)) as OwnerType

- title: "OUs By Computer Member Count"
  category: Inventory
  type: cypher
  format: HTML
  output: OUs_ComputerCount.html
  cypher: >
    MATCH (o:OU)-[:Contains]->(c:Computer) RETURN o.distinguishedname as DN, COUNT(c) as Computers ORDER BY COUNT(c) DESC

- title: "OUs By User Member Count"
  category: Inventory
  type: cypher
  format: HTML
  output: OUs_UserCount.html
  cypher: >
    MATCH (o:OU)-[:Contains]->(c:User) RETURN  o.distinguishedname as DN, COUNT(c) as Users ORDER BY COUNT(c) DESC

- title: "OUs By Group Member Count"
  category: Inventory
  type: cypher
  format: HTML
  output: OUs_GroupCount.html
  cypher: >
    MATCH (o:OU)-[:Contains]->(c:Group) RETURN  o.distinguishedname as DN, COUNT(c) as Groups ORDER BY COUNT(c) DESC

- title: "Cert Publishers (Direct)"
  category: Privilege
  type: cypher
  format: HTML
  output: CertPublishers.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-517' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "DA Sessions"
  category: Access
  type: cypher
  format: HTML
  output: DA_Sessions.html
  cypher: >
    MATCH (n:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' MATCH p = (c:Computer)-[:HasSession]->(n) return n.name as Username, c.name as Computer

- title: "EA Sessions"
  category: Access
  type: cypher
  format: HTML
  output: EA_Sessions.html
  cypher: >
    MATCH (n:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-519' MATCH p = (c:Computer)-[:HasSession]->(n) return n.name as Username, c.name as Computer

- title: "User Sessions Count"
  category: Access
  type: cypher
  format: HTML
  output: UserSessionsCount.html
  cypher: >
    MATCH (n:User)-[r:HasSession]->(m:Computer) RETURN n.name, count(DISTINCT(m.name)) as SessionCount order by SessionCount desc LIMIT 100

- title: "HighValue Group Members (Direct) (Limited to 1000)"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: Groups-HighValue-members
  cypher: >
    MATCH p=(n:User)-[r:MemberOf]->(m:Group {highvalue:true}) RETURN n.name as User, m.name as Group Limit 1000

- title: "Protected Users Group (Direct)"
  category: Privilege
  type: cypher
  format: HTML
  output: ProtectedUsers.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-525' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "Admins Without Sensitive Protection Flag"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: AdminsWithoutSensitiveFlag.html
  cypher: >
    MATCH p=(n:User)-[r:MemberOf]->(m:Group {highvalue:true}) WHERE n.sensitive=false RETURN m.name as Group, n.name as User, n.displayname as DisplayName,n.description as Description, n.enabled as Enabled, n.pwdneverexpires as PWDNeverExpire, n.trustedtoauth as TrustedToAuth, n.unconstraineddelegation as UncDelegation LIMIT 1000

- title: "Kerberoastable Users"
  category: Kerberos
  type: cypher
  format: HTML
  output: Kerberoastable_Users.html
  cypher: >
    MATCH (n:User) WHERE n.hasspn=true RETURN n.name as Username, n.displayname as DisplayName,n.description as Description, n.enabled as Enabled, n.pwdneverexpires as PasswordNeverExpires, n.passwordnotreqd as PasswordNotRequired, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPNs

- title: "Pre-Windows 2000 Compatibility Access Direct Members"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: PreWindows2000.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid ENDS WITH 'S-1-5-32-554' RETURN n.domain as Domain, m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "RDPable Servers"
  category: Access
  type: cypher
  format: HTML
  output: Workstations_RDP.html
  cypher: >
    match p=(g:Group)-[:CanRDP]->(c:Computer) where  g.objectid ENDS WITH '-513'  AND c.operatingsystem CONTAINS 'Server' return c.name as Computer

- title: "Domain Controller Owners"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: DCOwners
  cypher: >
    MATCH (c1:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (u1)-[:Owns]->(c2:Computer) WHERE c2.name IN domainControllers RETURN  c2.name as DC, u1.name as Owner, head(labels(u1)) as Type, u1.enabled as Enabled ORDER BY DC, Owner

- title: "Domain Controller Owned by Users"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: DCOwners-Users
  cypher: >
    MATCH (c1:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (u1:User)-[:Owns]->(c2:Computer) WHERE c2.name IN domainControllers RETURN c2.name as DC, u1.name as Owner, u1.displayname as Name, u1.description as Description,  u1.enabled as Enabled ORDER BY DC, Owner

- title: "Unconstrained Delegation Users with SPN"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: Users_UnconstrainedDelegation
  cypher: >
    MATCH (c:User {unconstraineddelegation:true}) return c.name as User, c.description as Description, c.serviceprincipalnames as SPN

- title: "Unconstrained Delegation Computers with SPN"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: Computers_UnconstrainedDelegation
  cypher: >
    MATCH (c:Computer {unconstraineddelegation:true}) return c.name as Computer, c.description as Description, c.serviceprincipalnames as SPN

- title: "Unconstrained Delegation Computers with SPN Non-DC"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: Computers_UnconstrainedDelegationNonDC
  cypher: >
    MATCH (c1:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (c2:Computer {unconstraineddelegation:true}) WHERE NOT c2.name IN domainControllers RETURN c2.name as Computer, c2.description as Description, c2.operatingsystem as OS, c2.serviceprincipalnames as SPN ORDER BY c2.name ASC

- title: "Constrained Delegation - All"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-All
  cypher: >
    MATCH (a)-[:AllowedToDelegate]->(b) RETURN a.name as Object, a.enabled as Enabled, head(labels(a)) as Type, b.name as Target, head(labels(b)) as TargetType

- title: "Constrained Delegation - Users"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-Users
  cypher: >
    MATCH (a:User)-[:AllowedToDelegate]->(c:Computer) RETURN a.name as User, a.enabled as Enabled, c.name as TargetComputer

- title: "Constrained Delegation - Users NonDA"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-UsersNonDA
  cypher: >
    MATCH (u1:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' WITH COLLECT(u1.name) AS DAs MATCH (a:User)-[:AllowedToDelegate]->(c:Computer) WHERE NOT a.name IN DAs RETURN a.name as User, a.enabled as Enabled, c.name as TargetComputer

- title: "Constrained Delegation - Computers NonDC"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-ComputersNonDC
  cypher: >
    MATCH (c1:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (c2:Computer {unconstraineddelegation:true}) WHERE NOT c2.name IN domainControllers RETURN c2.name as Computer, c2.description as Description, c2.enabled as Enabled, c2.operatingsystem as OS, c2.serviceprincipalnames as SPN ORDER BY c2.name ASC

- title: "DCSync Direct Relationships"
  category: DCSync
  type: cypher
  format: HTMLCSV
  output: DCSyncDirect
  cypher: >
    MATCH (u)-[:DCSync]->(d:Domain) RETURN d.name AS Domain, u.name as Object, u.enabled as Enabled, head(labels(u)) as type ORDER BY Domain, Object

- title: "DCSync Privileged Non-DCs"
  category: DCSync
  type: cypher
  format: HTMLCSV
  output: DCSyncDirectNonDCComputers
  cypher: >
    MATCH (c1:Computer)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (c2:Computer)-[:DCSync]->(d:Domain) WHERE NOT c2.name IN domainControllers RETURN d.name AS Domain, c2.name as Computer, c2.enabled as Enabled ORDER BY Domain, Computer

- title: "DCSync Privileged Non-DAs"
  category: DCSync
  type: cypher
  format: HTMLCSV
  output: DCSyncDirectNonDAUsers
  cypher: >
    MATCH (u1:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' WITH COLLECT(u1.name) AS DAs MATCH (u2:User)-[:DCSync]->(d:Domain) WHERE NOT u2.name IN DAs RETURN d.name AS Domain, u2.name as User, u2.displayname as Name, u2.description as Description, u2.enabled as Enabled ORDER BY Domain, User

- title: "Users (Non-Admin) With AddMember Group Permissions "
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: UsersnonadminAddMemberGroups
  cypher: >
    MATCH(u:User)-[r:AddMember]->(g:Group) WHERE u.admincount = FALSE RETURN u.name as User, g.name as Group

- title: "Direct Relationships - Everyone"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-Everyone.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH 'S-1-1-0'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Authenticated Users"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-AuthenticatedUsers.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH 'S-1-5-11'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Pre-Windows 2000 Compatibility Access"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-PreW2KCA.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH 'S-1-5-32-554'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Domain Users"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-DomainUsers.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-513'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Domain Computers"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-DomainComputers.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-515'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Users"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-Users.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-545'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Guests"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-Guests.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-546'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "PasswordResetter Groups Count"
  category: Privilege
  type: cypher
  format: HTML
  output: Groups_CanResetPasswordsCount.html
  cypher: >
    MATCH p=(m:Group)-[r:ForceChangePassword]->(n:User) RETURN m.name as Group, m.distinguishedname as DN, count(*) as Users ORDER BY Users DESC

- title: "GPOs"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPOs
  cypher: >
    Match (n:GPO) return n.name as GPO, n.highvalue as HighValue, n.gpcpath as Path

- title: "GPO OU Links"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPO_OU_Links
  cypher: >
    MATCH (u:GPO)-[:GPLink]->(g) RETURN g.distinguishedname AS OU, u.name as GPO ORDER BY OU, GPO

- title: "GPO Owners Summary Count"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPOOwners-Summary
  cypher: >
    MATCH (u)-[:Owns]->(g:GPO) RETURN u.name as Owner, u.enabled as Enabled, head(labels(u)) as Type,  count(g.name) AS GPOs ORDER BY GPOs DESC, Owner

- title: "GPO Owners Detail"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPOOwners-Detail
  cypher: >
    MATCH (u)-[:Owns]->(g:GPO) RETURN u.name as Owner, u.enabled as Enabled, head(labels(u)) as Type, g.name AS GPO ORDER BY GPO, Owner

- title: "GPO Owners - Non-(Direct)DAs"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPOOwners-NonDA
  cypher: >
    MATCH (u1:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' WITH COLLECT(u1.name) AS DAs MATCH (u2:User)-[:Owns]->(gp:GPO) WHERE NOT u2.name IN DAs  RETURN gp.name AS GPO, u2.name as Owner, u2.enabled as Enabled ORDER BY GPO, Owner

- title: "GPOS - Non-(Direct)DA Users With Interesting GPO Permissions"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPOs-NonDA-WithInterestingPermissions
  cypher: >
    MATCH (u1:User)-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' WITH COLLECT(u1.name) AS DAs MATCH (u2:User)-[r:AllExtendedRights|GenericAll|GenericWrite|Owns|WriteDacl|WriteOwner]->(g:GPO) WHERE NOT u2.name in DAs RETURN u2.name as User, type(r) as Relationship, g.name as GPO

- title: "GPO Creator Owners (Direct)"
  category: GPO
  type: cypher
  format: HTML
  output: GPOCreatorOwners.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-520' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "RDPable Groups"
  category: Access
  type: cypher
  format: HTML
  output: RDPableGroups.html
  cypher: >
    MATCH p=(m:Group)-[r:CanRDP]->(n:Computer) RETURN m.name as Group, n.name as Computer ORDER BY m.name

- title: "RDPable Groups Count"
  category: Access
  type: cypher
  format: HTML
  output: RDPableGroupsCount.html
  cypher: >
    MATCH p=(m:Group)-[r:CanRDP]->(n:Computer) RETURN m.name as Group, count(*) as Computer ORDER BY Computer DESC

- title: "Computers Vulnerable to Local Admin Enumeration"
  category: Local Admin
  type: cypher
  format: HTMLCSV
  output: Computers_LocalAdminEnumeration
  cypher: >
    MATCH p=()-[:AdminTo]->(n:Computer) RETURN  distinct(n.name) as Host, n.operatingsystem as OS

- title: "Local Admins - Groups"
  category: Local Admin
  type: cypher
  format: HTML
  output: LocalAdmin_Groups.html
  cypher: >
    MATCH p=(m:Group)-[r:AdminTo]->(n:Computer) RETURN m.name as Group, n.name as Computer ORDER BY m.name

- title: "Local Admins - Groups Count"
  category: Local Admin
  type: cypher
  format: HTML
  output: LocalAdmin_Groups_Count.html
  cypher: >
    MATCH p=(m:Group)-[r:AdminTo]->(n:Computer) RETURN m.name as Group, count(*) as Computer ORDER BY Computer DESC

- title: "Local Admins - Users"
  category: Local Admin
  type: cypher
  format: HTML
  output: LocalAdmin_Users.html
  cypher: >
    MATCH p=(m:User)-[r:AdminTo]->(n:Computer) RETURN m.name as User, n.name as Computer ORDER BY m.name

- title: "Local Admins - Users Count"
  category: Local Admin
  type: cypher
  format: HTML
  output: LocalAdmin_UsersCount.html
  cypher: >
    MATCH p=(m:User)-[r:AdminTo]->(n:Computer) RETURN m.name as User, count(*) as ComputerCount ORDER BY ComputerCount DESC

- title: "Local Admins - Computers"
  category: Local Admin
  type: cypher
  format: HTMLCSV
  output: LocalAdmin_Computers_
  cypher: >
    MATCH p=(m:Computer {enabled: True})-[r1:MemberOf*0..]->(g)-[r2:AdminTo*1..]->(n:Computer) WHERE n <> m RETURN m.name as Computer, n.name as TargetComputer

- title: "Local Admins - Computers Count"
  category: Local Admin
  type: cypher
  format: HTML
  output: LocalAdmins_Computers_count.html
  cypher: >
    MATCH p=(m:Computer {enabled: True})-[r1:MemberOf*0..]->(g)-[r2:AdminTo*1..]->(n:Computer) WHERE n <> m RETURN m.name as Computer, COUNT(n) as TargetComputerCount

