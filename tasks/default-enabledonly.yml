- title: "Domains"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: Domains
  cypher: >
    MATCH (n:Domain) return n.name as Domain, n.functionallevel as FunctionalLevel, n.highvalue as HighValue, n.domain as DNS, n.distinguishedname as DN, n.domainsid as SID

- title: "Domain Trusts"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: DomainTrusts
  cypher: >
    MATCH p=(n:Domain)-[r:TrustedBy]->(m:Domain) RETURN n.name as Domain1, r.trusttype as TrustType, r.isacl as IsACL, r.sidfiltering as SidFiltering, r.transitive as transitive,  m.name as Domain2 order by n.name, m.name

- title: "Domain Controllers"
  category: Domain
  type: cypher
  format: HTMLCSV
  output: DomainControllers
  cypher: >
    MATCH (c:Computer {enabled: True})-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-516' RETURN c.name as Hostname, c.operatingsystem as OS, c.description as Description,toString(datetime({epochSeconds: ToInteger(coalesce(c.whencreated,0))})) as Created,c.haslaps as LAPS, c.enabled as Enabled, c.distinguishedname as DN

- title: "Enterprise Admins"
  category: Uncategorized
  type: cypher
  format: HTML
  output: EnterpriseAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-519' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "Schema Admins"
  category: Uncategorized
  type: cypher
  format: HTML
  output: SchemaAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-518' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "Domain Admins"
  category: Uncategorized
  type: cypher
  format: HTML
  output: DomainAdmins.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-512' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "Admin Groups"
  category: Privilege
  type: cypher
  format: HTMLCSV
  output: AdminGroups
  cypher: >
    Match (n:Group) WHERE n.name CONTAINS 'ADMIN' return n.name as Name, n.highvalue as HighValue, n.description as Description, n.admincount as AdminCount

- title: "Domain Users"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: DomainUsers
  cypher: >
    MATCH (n:User {enabled: True}) RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Domain Computers"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: DomainComputers
  cypher: >
    MATCH (n:Computer {enabled: True}) RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon,n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

- title: "Domain Groups"
  category: Inventory
  type: cypher
  format: HTMLCSV
  output: DomainGroups
  cypher: >
    Match (n:Group) return n.name as Name, n.highvalue as HighValue, n.description as Description, n.admincount as AdminCount

- title: "OUs By Computer Member Count"
  category: Inventory
  type: cypher
  format: HTML
  output: OUs_Count.html
  cypher: >
    MATCH (o:OU)-[:Contains]->(c:Computer {enabled: True}) RETURN o.name as OU, o.distinguishedname as DN, COUNT(c) as Computers ORDER BY COUNT(c) DESC

- title: "Cert Publishers"
  category: Uncategorized
  type: cypher
  format: HTML
  output: CertPublishers.html
  cypher: >
     MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-517' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation

- title: "DA Sessions"
  category: Access
  type: cypher
  format: HTML
  output: DA_Sessions.html
  cypher: >
    MATCH (n:User {enabled: True})-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-512' MATCH p = (c:Computer {enabled: True})-[:HasSession]->(n) return n.name as Username, c.name as Computer

- title: "EA Sessions"
  category: Access
  type: cypher
  format: HTML
  output: EA_Sessions.html
  cypher: >
    MATCH (n:User {enabled: True})-[:MemberOf]->(g:Group) WHERE g.objectid ENDS WITH '-519' MATCH p = (c:Computer {enabled: True})-[:HasSession]->(n) return n.name as Username, c.name as Computer

- title: "HighValue Group Members"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Groups-HighValue-members
  cypher: >
    MATCH p=(n:User)-[r:MemberOf*1..]->(m:Group {highvalue:true}) RETURN n.name as User, m.name as Group

- title: "Kerberoastable Users"
  category: Kerberos
  type: cypher
  format: HTML
  output: Kerberoastable_Users.html
  cypher: >
    MATCH (n:User {enabled: True}) WHERE n.hasspn=true RETURN n.name as Username, n.displayname as DisplayName,n.description as Description, n.title as Title, n.pwdneverexpires as PasswordNeverExpires, n.passwordnotreqd as PasswordNotRequired, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPNs

- title: "RDPable Servers"
  category: Access
  type: cypher
  format: HTML
  output: Workstations_RDP.html
  cypher: >
    match p=(g:Group)-[:CanRDP]->(c:Computer {enabled: True}) where g.objectid ENDS WITH '-513'  AND c.operatingsystem CONTAINS 'Server' return c.name as Computer

- title: "Unconstrained Delegation Computers with SPN"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: Computers_UnconstrainedDelegation
  cypher: >
    MATCH (c:Computer {unconstraineddelegation:true}) WHERE c.enabled return c.name as Computer, c.description as Description, c.serviceprincipalnames as SPN

- title: "Unconstrained Delegation Computers with SPN Non-DC"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: Computers_UnconstrainedDelegationNonDC
  cypher: >
    MATCH (c1:Computer {enabled: True})-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (c2:Computer {unconstraineddelegation:true}) WHERE NOT c2.name IN domainControllers AND c2.enabled RETURN c2.name as Computer, c2.description as Description, c2.operatingsystem as OS, c2.serviceprincipalnames as SPN ORDER BY c2.name ASC

- title: "Permissions for Everyone and Authenticated Users"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Permissions_Everyone
  cypher: >
    MATCH p=(m:Group)-[r:AddMember|AdminTo|AllExtendedRights|AllowedToDelegate|CanRDP|Contains|ExecuteDCOM|ForceChangePassword|GenericAll|GenericWrite|GetChanges|GetChangesAll|HasSession|Owns|ReadLAPSPassword|SQLAdmin|TrustedBy|WriteDACL|WriteOwner|AddAllowedToAct|AllowedToAct]->(t) WHERE m.objectsid ENDS WITH '-513' OR m.objectsid ENDS WITH '-515' OR m.objectsid ENDS WITH 'S-1-5-11' OR m.objectsid ENDS WITH 'S-1-1-0' RETURN m.name as Group,TYPE(r) as Relationship,t.name as TargetNode,t.enabled as TargetEnabled

- title: "Direct Relationships - Everyone"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-Everyone.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH 'S-1-1-0'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Authenticated Users"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-AuthenticatedUsers.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH 'S-1-5-11'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Pre-Windows 2000 Compatibility Access"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-PreW2KCA.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH 'S-1-5-32-554'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Domain Users"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-DomainUsers.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-513'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Domain Computers"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-DomainComputers.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-515'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Users"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-Users.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-545'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Direct Relationships - Guests"
  category: Exposure
  type: cypher
  format: HTML
  output: Relationships-Guests.html
  cypher: >
    MATCH p = (g:Group)-[r]->(n) WHERE r.isacl=true AND  g.objectid ENDS WITH '-546'  RETURN g.name as Subject, type(r) as Relationship, n.name as Target, n.enabled as Enabled, n.unconstraineddelegation as UncDelegation, n.haslaps as LAPS, n.trustedtoauth as TrustedToAuth

- title: "Cross Domain Relationships"
  category: Uncategorized
  type: cypher
  format: HTML
  output: CrossDomainRelationships.html
  cypher: >
    MATCH (n)-[r]->(m) WHERE NOT toUpper(n.domain) = toUpper(m.domain) AND (n.enabled is NULL OR n.enabled = True) AND (m.enabled is NULL OR m.enabled = True) RETURN n.name as Domain_A_Object, n.domain as Domain_A, n.enabled as Domain_A_Object_Enabled, TYPE(r) as Relationship, m.name as Domain_B_Object, m.domain as Domain_B, m.enabled as Domain_B_Object_Enabled

- title: "PasswordResetter Groups Count"
  category: Privilege
  type: cypher
  format: HTML
  output: Groups_CanResetPasswordsCount.html
  cypher: >
    MATCH p=(m:Group)-[r:ForceChangePassword]->(n:User {enabled: True}) RETURN m.name as Group, m.distinguishedname as DN, count(*) as Users ORDER BY Users DESC

- title: "GPOs"
  category: GPO
  type: cypher
  format: HTMLCSV
  output: GPOs
  cypher: >
    Match (n:GPO) return n.name as GPO, n.highvalue as HighValue, n.gpcpath as Path

- title: "GPO Creator Owners"
  category: Uncategorized
  type: cypher
  format: HTML
  output: GPOCreatorOwners.html
  cypher: >
    MATCH p=(n:Group)<-[:MemberOf*1..]-(m) WHERE n.objectid =~ '(?i)S-1-5-.*-520' RETURN m.name as Name, m.displayname as DisplayName,m.description as Description, m.enabled as Enabled, m.pwdneverexpires as PWDNeverExpire, m.trustedtoauth as TrustedToAuth, m.unconstraineddelegation as UncDelegation 

- title: "RDPable Groups"
  category: Access
  type: cypher
  format: HTML
  output: RDPableGroups.html
  cypher: >
    MATCH p=(m:Group)-[r:CanRDP]->(n:Computer {enabled: True}) RETURN m.name as Group, n.name as Computer ORDER BY m.name

- title: "RDPable Groups Count"
  category: Access
  type: cypher
  format: HTML
  output: RDPableGroupsCount.html
  cypher: >
    MATCH p=(m:Group)-[r:CanRDP]->(n:Computer {enabled: True}) RETURN m.name as Group, count(*) as Computer ORDER BY Computer DESC

- title: "Kerberoastable Most Priv"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Kerberoastable_Users_MostPriv.html
  cypher: >
    MATCH (u:User {hasspn:true}) OPTIONAL MATCH (u)-[:AdminTo]->(c1:Computer {enabled: True}) OPTIONAL MATCH (u)-[:MemberOf*1..]->(:Group)-[:AdminTo]->(c2:Computer {enabled: True}) WITH u,COLLECT(c1) + COLLECT(c2) AS tempVar UNWIND tempVar AS comps RETURN u.name as KeroastableUser,COUNT(DISTINCT(comps)) as Computers ORDER BY COUNT(DISTINCT(comps)) DESC

- title: "Most Admin Privileged Groups"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Groups_MostAdminPrivileged.html
  cypher: >
    MATCH (g:Group) OPTIONAL MATCH (g)-[:AdminTo]->(c1:Computer {enabled: True}) OPTIONAL MATCH (g)-[:MemberOf*1..]->(:Group)-[:AdminTo]->(c2:Computer {enabled: True}) WITH g, COLLECT(c1) + COLLECT(c2) AS tempVar UNWIND tempVar AS computers RETURN g.name AS GroupName,COUNT(DISTINCT(computers)) AS AdminRightCount ORDER BY AdminRightCount DESC

- title: "Local AdminGroups"
  category: Uncategorized
  type: cypher
  format: HTML
  output: LocalAdmin_Groups.html
  cypher: >
    MATCH p=(m:Group)-[r:AdminTo]->(n:Computer {enabled: True}) RETURN m.name as Group, n.name as Computer ORDER BY m.name

- title: "Local AdminGroups Count"
  category: Uncategorized
  type: cypher
  format: HTML
  output: LocalAdmin_Groups_Count.html
  cypher: >
    MATCH p=(m:Group)-[r:AdminTo]->(n:Computer {enabled: True}) RETURN m.name as Group, count(*) as Computer ORDER BY Computer DESC

- title: "Local AdminUsers"
  category: Uncategorized
  type: cypher
  format: HTML
  output: LocalAdmin_Users.html
  cypher: >
    MATCH p=(m:User {enabled: True})-[r:AdminTo]->(n:Computer {enabled: True}) RETURN m.name as User, n.name as Computer ORDER BY m.name

- title: "Local AdminUsers Count"
  category: Uncategorized
  type: cypher
  format: HTML
  output: LocalAdmin_UsersCount.html
  cypher: >
    MATCH p=(m:User {enabled: True})-[r:AdminTo]->(n:Computer {enabled: True}) RETURN m.name as User, count(*) as Computer ORDER BY Computer DESC

- title: "Servers in OUs"
  category: Uncategorized
  type: cypher
  format: HTML
  output: ServersInOUs.html
  cypher: >
    MATCH (o:OU)-[:Contains]->(c:Computer {enabled: True}) WHERE toUpper(c.operatingsystem) STARTS WITH 'WINDOWS SERVER' RETURN o.name as OU,c.name as Computer,c.operatingsystem as OS

- title: "Computers with MSSQL SPN"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: Computers_MSSQL
  cypher: >
    MATCH (c:Computer {enabled: True}) WHERE ANY (x IN c.serviceprincipalnames WHERE toUpper(x) CONTAINS 'MSSQL') RETURN c.name as Computer, c.enabled as Enabled, c.serviceprincipalnames as SPN ORDER BY c.name ASC

- title: "Computers Admin of Computers"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Computers_admin_computers
  cypher: >
    MATCH p=(m:Computer {enabled: True})-[r1:MemberOf*0..]->(g)-[r2:AdminTo*1..]->(n:Computer {enabled: True}) WHERE n <> m RETURN m.name as Computer, n.name as TargetComputer

- title: "Computers Admin of Computers Count"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Computers_admin_computers_count.html
  cypher: >
    MATCH p=(m:Computer {enabled: True})-[r1:MemberOf*0..]->(g)-[r2:AdminTo*1..]->(n:Computer {enabled: True}) WHERE n <> m RETURN m.name as Computer, COUNT(n) as TargetComputerCount

- title: "Computers with Descriptions"
  category: Systems
  type: cypher
  format: HTMLCSV
  output: Computers_WithDescriptions
  cypher: >
    MATCH (c:Computer {enabled: True}) WHERE c.description IS NOT NULL RETURN c.name as Computer,c.description as Description

- title: "Computers Vulnerable to Local Admin Enumeration"
  category: Local Admin
  type: cypher
  format: HTMLCSV
  output: Computers_With_More_Than1_Local_Admin
  cypher: >
    MATCH p=()-[:AdminTo]->(n:Computer {enabled: True}) RETURN n.name as Host, n.operatingsystem as OS

- title: "Operating Systems Unsupported"
  category: Systems
  type: cypher
  format: HTMLCSV
  output: OperatingSystemUnsupported
  cypher: >
    MATCH (c:Computer {enabled: True}) WHERE c.operatingsystem =~ '.*(2000|2003|2008|2012|xp|vista|7|me).*' RETURN c.name as Computer, c.operatingsystem as UnsupportedOS, c.enabled as Enabled

- title: "Operating Systems Count"
  category: Systems
  type: cypher
  format: HTML
  output: OperatingSystemCount.html
  cypher: >
    MATCH (c:Computer {enabled: True}) RETURN c.operatingsystem aS OS, count(*) as Computers ORDER BY Computers DESC

- title: "LAPS Deployment Count"
  category: Systems
  type: cypher
  format: HTMLCSV
  output: LapsDeploymentCount
  cypher: >
    MATCH (c:Computer {enabled: True}) RETURN c.haslaps as LAPSEnabled, count(*) as Computers ORDER BY Computers DESC

- title: "LAPS Deployment OS Count"
  category: Systems
  type: cypher
  format: HTMLCSV
  output: LapsDeploymentCount-OS
  cypher: >
    MATCH (c:Computer {enabled: True}) RETURN c.haslaps as LAPSEnabled, c.operatingsystem as OS, count(*) as Computers ORDER BY LAPSEnabled DESC, Computers DESC

- title: "LAPS Not Enabled"
  category: Systems
  type: cypher
  format: HTML
  output: LAPSNotEnabled.html
  cypher: >
    MATCH (c:Computer {enabled: True}) WHERE c.haslaps=false RETURN c.name as Computer, c.enabled as Enabled, c.operatingsystem as OS, c.description as Descirption ORDER BY Computer

- title: "Users Sessions"
  category: Access
  type: cypher
  format: HTMLCSV
  output: Users_Sessions
  cypher: >
    MATCH p=(n:User {enabled: True})--(c:Computer {enabled: True})-[:HasSession]->(n) return n.name as User,  c.name as Computer ORDER BY n.name

- title: "Users Sessions Count"
  category: Access
  type: cypher
  format: HTML
  output: Users_Sessions_Count.html
  cypher: >
    MATCH p=(n:User {enabled: True})--(c:Computer {enabled: True})-[:HasSession]->(n) return n.name as User, count(*) as Computers ORDER BY Computers DESC

- title: "Users With 6 Month Old Passwords"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Users_6MoOldPasswords
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User {enabled: True}) WHERE date_now - toInteger(n.pwdlastset) > 15552000 AND n.pwdlastset<>-1.0  AND n.pwdlastset<>0.0 RETURN n.name as Username, n.displayname as DisplayName, n.description as Description, n.enabled as Enabled, n.admincount as AdminCount, n.pwdneverexpires as PassNeverExpire, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon ORDER BY n.pwdlastset

- title: "Users With 5 Year Old Passwords"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Users_5YrOldPasswords
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User {enabled: True}) WHERE date_now - toInteger(n.pwdlastset) > 157680000 AND n.pwdlastset<>-1.0  AND n.pwdlastset<>0.0 RETURN n.name as Username, n.displayname as DisplayName, n.description as Description, n.enabled as Enabled, n.admincount as AdminCount, n.pwdneverexpires as PassNeverExpire, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon ORDER BY n.pwdlastset

- title: "Users With 10 Year Old Passwords"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Users_10YrOldPasswords
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User {enabled: True}) WHERE date_now - toInteger(n.pwdlastset) > 315360000 AND n.pwdlastset<>-1.0  AND n.pwdlastset<>0.0 RETURN n.name as Username, n.displayname as DisplayName, n.description as Description, n.enabled as Enabled, n.admincount as AdminCount, n.pwdneverexpires as PassNeverExpire, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon ORDER BY n.pwdlastset

- title: "Users With Userpassword Attribute"
  category: Hygiene
  type: cypher
  format: HTMLCSV
  output: Users_userpassword
  cypher: >
    MATCH (u:User {enabled: True}) WHERE NOT u.userpassword IS null RETURN u.name as User, u.userpassword as Password, u.enabled as Enabled

- title: "User No Kerb Needed"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: Users_NoKerbReq
  cypher: >
    MATCH (n:User {dontreqpreauth: true}) WHERE n.enabled RETURN n.name as Username, n.displayname as DisplayName, n.description as Description, n.title as Title, n.pwdneverexpires as PasswordNeverExpires, n.passwordnotreqd as PasswordNotRequired, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPNs

- title: "Users Computer Direct Admin Count"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Users_Count_DirectAdminComputers.html
  cypher: >
    MATCH (u:User {enabled: True})-[:AdminTo]->(c:Computer {enabled: True}) RETURN count(DISTINCT(c.name)) AS COMPUTER, u.name AS USER ORDER BY count(DISTINCT(c.name)) DESC

- title: "Users Computer InDirect Admin Count"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Users_Count_InDirectAdminComputers.html
  cypher: >
    MATCH (u:User {enabled: True})-[:AdminTo]->(c:Computer {enabled: True}) RETURN count(DISTINCT(c.name)) AS COMPUTER, u.name AS USER ORDER BY count(DISTINCT(c.name)) DESC

- title: "Users Not Active 6 Months"
  category: Hygiene
  type: cypher
  format: HTMLCSV
  output: UsersNotActive6mo
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User {enabled: True}) WHERE date_now - toInteger(n.lastlogontimestamp) > 15552000 AND n.lastlogontimestamp<>-1.0 RETURN n.name as Username, n.displayname as DisplayName, toInteger(n.lastlogontimestamp) as LastLogonTimeStamp

- title: "Users Not Active 12 Months"
  category: Hygiene
  type: cypher
  format: HTMLCSV
  output: UsersNotActive12mo
  cypher: >
    WITH timestamp() / 1000 AS date_now MATCH (n:User) WHERE date_now - toInteger(n.lastlogontimestamp) > 31104000 AND n.lastlogontimestamp<>-1.0 RETURN n.name as Username, n.displayname as DisplayName, toInteger(n.lastlogontimestamp) as LastLogonTimeStamp

- title: "Users Never Active"
  category: Hygiene
  type: cypher
  format: HTMLCSV
  output: Users_NeverActive_Enabled
  cypher: >
    MATCH (n:User {enabled: True}) WHERE n.lastlogontimestamp=-1.0 RETURN n.name as Username ORDER BY n.name

- title: "Users Password Never Expires Exception"
  category: Hygiene
  type: cypher
  format: HTMLCSV
  output: Users_NeverExpirePasswords
  cypher: >
    MATCH (n:User {enabled: True}) WHERE n.pwdneverexpires RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Hunt - Users with Pass or PW in Description"
  category: Hunt
  type: cypher
  format: HTML
  output: HuntUsersWithPassInDescription.html
  cypher: >
    MATCH (n:User {enabled: True}) WHERE n.description  =~ '(?i).*(pass|pw).*' RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Hunt - Computers with Pass or PW in Description"
  category: Hunt
  type: cypher
  format: HTML
  output: HuntComputersWithPassInDescription.html
  cypher: >
    MATCH (n:Computer {enabled: True}) WHERE n.description =~ '(?i).*(pass|pw).*' RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon,n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

- title: "Owned Groups"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Groups.html
  cypher: >
    Match (n:Group) where n.owned=TRUE return n.name as Name, n.highvalue as HighValue, n.description as Description

- title: "Owned Users"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Users.html
  cypher: >
    MATCH (n:User {enabled: True}) WHERE n.owned=TRUE RETURN n.name as Name,n.displayname as DisplayName,n.enabled as Enabled, n.highvalue as HighValue,  n.description as Description, n.title as Title, n.pwdneverexpires as PWDNeverExpires, n.passwordnotreqd as PWDNotReqd, n.sensitive as Sensitive, n.admincount as AdminCount, n.serviceprincipalnames as SPN, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon

- title: "Owned Computers"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Computers.html
  cypher: >
    MATCH (n:Computer {enabled: True}) where n.owned=TRUE RETURN n.name as Name, n.domain, n.enabled as Enabled,n.haslaps as LAPS, n.highvalue as HighValue,n.operatingsystem as OS,  n.description as Description, toString(datetime({epochSeconds: ToInteger(coalesce(n.pwdlastset,0))})) as PWDLastSet, toString(datetime({epochSeconds: ToInteger(coalesce(n.lastlogon,0))})) as LastLogon,n.serviceprincipalnames as SPN ORDER BY n.highvalue DESC , n.name ASC

- title: "Owned Users Groups"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Owned-Users-Groups.html
  cypher: >
    MATCH (m:User {enabled: True}) WHERE m.owned=TRUE WITH m MATCH p=(m)-[:MemberOf*1..]->(n:Group) RETURN m.name, n.name ORDER BY m.name

- title: "Owned Computers Groups"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Owned-Computers-Groups.html
  cypher: >
    MATCH (m:Computer {enabled: True}) WHERE m.owned=TRUE WITH m MATCH p=(m)-[:MemberOf*1..]->(n:Group) RETURN m.name, n.name ORDER BY m.name

- title: "Owned Objects"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Objects.html
  cypher: >
    MATCH (n {owned:true}) return n.name as Name, n.highvalue as HighValue, n.enabled as Enabled, n.trustedtoauth as TrustedToAuth, n.unconstraineddelegation as UncDelegation, n.serviceprincipalnames as SPN

- title: "Owned Objects Admin To"
  category: Owned
  type: cypher
  format: HTML
  output: Owned-Objects-AdminTo-Direct.html
  cypher: >
    MATCH (n {owned:true})-[r:AdminTo]->(c:computer {enabled: True}) return n.name as Name, n.highvalue as HighValue, n.enabled as Enabled, c.name as Computer, c.highvalue as ComputerHighValue, c.enabled as ComputerEnabled, c.serviceprincipalname as ComputerSPN

- title: "Owned Objects Member Of"
  category: Uncategorized
  type: cypher
  format: HTML
  output: Owned-Objects-MemberOf-Direct.html
  cypher: >
    MATCH (n {owned:true})-[r:MemberOf]->(g:Group) return n.name as Name, n.highvalue as HighValue, n.enabled as Enabled, g.name as GroupName, g.description as GroupDescription

- title: "Report Index"
  category: Uncategorized
  type: directive
  format: HTML
  output: index.html
  cypher: >
    REPORT-INDEX

- title: "Zip Tasks"
  category: System
  type: directive
  format: ZIP
  output: Reports.zip
  cypher: >
    ZIP-TASKS

