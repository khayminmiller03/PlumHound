- title: "DCSync Direct Relationships"
  category: DCSync
  type: cypher
  format: HTMLCSV
  output: DCSyncDirect
  cypher: >
    MATCH (u)-[:DCSync]->(d:Domain) RETURN d.name AS Domain, u.name as Object, u.enabled as Enabled, head(labels(u)) as type ORDER BY Domain, Object

- title: "DCSync Non-DC's"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: DCSyncDirectNonDCComputers
  cypher: >
    MATCH (c1:Computer)-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(c1.name) AS domainControllers MATCH (c2:Computer)-[:DCSync]->(d:Domain) WHERE NOT c2.name IN domainControllers RETURN d.name AS Domain, c2.name as Computer, c2.enabled as Enabled ORDER BY Domain, Computer

- title: "DCSync Non-DAs"
  category: Uncategorized
  type: cypher
  format: HTMLCSV
  output: DCSyncDirectNonDAUsers
  cypher: >
    MATCH (u1:User)-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-512' WITH COLLECT(u1.name) AS DAs MATCH (u2:User)-[:DCSync]->(d:Domain) WHERE NOT u2.name IN DAs RETURN d.name AS Domain, u2.name as User, u2.enabled as Enabled ORDER BY Domain, User

- title: "Report Index"
  category: Uncategorized
  type: directive
  format: HTML
  output: index.html
  cypher: >
    REPORT-INDEX

