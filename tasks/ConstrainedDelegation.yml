- title: "Constrained Delegation - All"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-All
  cypher: >
    MATCH (a)-[:AllowedToDelegate]->(b) RETURN a.name as Object, a.enabled as Enabled, head(labels(a)) as Type, b.name as Target, head(labels(b)) as TargetType

- title: "Constrained Delegation - Users"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-Users
  cypher: >
    MATCH (a:User)-[:AllowedToDelegate]->(c:Computer) RETURN a.name as User, a.enabled as Enabled, c.name as TargetComputer

- title: "Constrained Delegation - Users NonDA"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-UsersNonDA
  cypher: >
    MATCH (u1:User)-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-512' WITH COLLECT(u1.name) AS DAs MATCH (a:User)-[:AllowedToDelegate]->(c:Computer) WHERE NOT a.name IN DAs RETURN a.name as User, a.enabled as Enabled, c.name as TargetComputer

- title: "Constrained Delegation - Computers NonDC"
  category: Kerberos
  type: cypher
  format: HTMLCSV
  output: ConstrainedDelegation-ComputersNonDC
  cypher: >
    MATCH (u1:Computer)-[:MemberOf*1..]->(g:Group) WHERE g.objectid ENDS WITH '-516' WITH COLLECT(u1.name) AS DCs MATCH (a:Computer)-[:AllowedToDelegate]->(c:Computer) WHERE NOT a.name IN DCs RETURN a.name as Computer, a.enabled as Enabled, c.name as TargetComputer

- title: "Report Index"
  category: Uncategorized
  type: directive
  format: HTML
  output: index.html
  cypher: >
    REPORT-INDEX

- title: "Zip Tasks"
  category: System
  type: directive
  format: ZIP
  output: Reports.zip
  cypher: >
    ZIP-TASKS

